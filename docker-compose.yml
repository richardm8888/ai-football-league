# Local development stack.
#
#   docker compose up -d db     # just the database, run the app with npm run dev
#   docker compose up           # database and app together, built locally
#
# Production does not use this file. The droplet runs docker-compose.prod.yml,
# which pulls a prebuilt image and talks to managed Postgres — see
# docs/DEPLOY.md. Keeping the two apart means development can have a throwaway
# database in a container without that arrangement ever reaching a server.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aifl
      POSTGRES_PASSWORD: aifl
      POSTGRES_DB: aifl
    ports:
      # Loopback only. The credentials above are development credentials, and
      # binding them to every interface is how they stop being harmless.
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aifl -d aifl']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aifl:aifl@db:5432/aifl
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET, e.g. openssl rand -hex 32}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-0}
      NODE_ENV: production
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && node server.js"
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  db-data:
